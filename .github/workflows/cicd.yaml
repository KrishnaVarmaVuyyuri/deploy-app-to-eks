name: "deploy node app to ec2 server through cicd"
on: 
  push: 
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:  
      - name: checkout the code from github
        uses: actions/checkout@v4

      - name: setting up the node js environment
        uses: actions/setup-node@v4
        with: 
          node-version: 22
          cache: npm
      - name: installing the dependencies
        run: npm ci

      - name: running the tests
        run: npm test

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: generating docker image tags
        id: meta
        uses: docker/metadata-action@v5
        with: 
          images: ${{secrets.DOCKERHUB_USERNAME}}/deploy-to-ec2
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: build and push docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify GitHub OIDC configuration
        run: |
              echo "Repository: $GITHUB_REPOSITORY"
              echo "Branch reference: $GITHUB_REF"
              echo "Expected subject:"
              echo "repo:${GITHUB_REPOSITORY}:ref:${GITHUB_REF}"
        
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{vars.AWS_ROLE_ARN}}
          aws-region: ${{vars.AWS_REGION }}


      - name: Verify AWS identity
        run: aws sts get-caller-identity

      

    
      - name: Deploy to EC2 using SSM
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -e

          IMAGE="${DOCKERHUB_USERNAME}/deploy-to-ec2:${IMAGE_TAG}"

          echo "Deploying image: ${IMAGE}"

          # Prepare SSM command
          jq -n \
            --arg instance "$EC2_INSTANCE_ID" \
            --arg image "$IMAGE" \
            '{
              DocumentName: "AWS-RunShellScript",
              InstanceIds: [$instance],
              Comment: "Deploy application from GitHub Actions",
              Parameters: {
                commands: [
                  "docker pull \($image)",
                  "docker rm -f devops-app || true",
                  "docker run -d --name devops-app --restart always -p 3000:3000 \($image)",
                  "sleep 5",
                  "curl -f http://localhost:3000/health"
                ]
              }
            }' > /tmp/ssm-command.json

          # Send deployment command
          COMMAND_ID=$(aws ssm send-command \
            --cli-input-json file:///tmp/ssm-command.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for deployment result
          STATUS="Pending"

          for i in $(seq 1 60); do
            if RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null); then

              STATUS="$RESULT"
            fi

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              break
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "Cancelled" || "$STATUS" == "TimedOut" || "$STATUS" == "Undeliverable" || "$STATUS" == "Terminated" ]]; then
              break
            fi

            sleep 5
          done

          # Display deployment output
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json || true

          if [ "$STATUS" != "Success" ]; then
            echo "EC2 deployment failed: $STATUS"
            exit 1
          fi

          echo "Application deployed successfully!"
         
        
